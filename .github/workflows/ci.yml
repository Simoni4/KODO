name: KODO checks

on:
  push:
    branches:
      - main
      - "kodo-2.0/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run game logic tests
        run: npm test
      - name: Check TypeScript
        run: npm run lint
      - name: Build production app
        run: npm run build
